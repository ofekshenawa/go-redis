name: Recheck negative tests
on:
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number shown on the report
        type: string
        required: true
  pull_request_target:
    branches: [negative-tests/label]
    types: [unlabeled]

permissions: {}
jobs:
  verify:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch) ||
      (github.event_name == 'pull_request_target' && startsWith(github.event.label.name, 'review-'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      statuses: write
      pull-requests: write
      issues: write
    concurrency:
      group: negative-decision-${{ github.event.number || inputs.pr }}
      cancel-in-progress: false
    steps:
      - name: Load the trusted verifier from the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Revalidate report, candidate and human action
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/telemetry-contract/recheck.py
