name: Negative-test approval evidence spike
on: workflow_dispatch
permissions:
  issues: write
  pull-requests: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Inspect a report reaction and a diagnostic label
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          root="repos/$REPO"
          label="spike-$GITHUB_RUN_ID"
          gh api -X POST "$root/labels" -f name="$label" -f color=aaaaaa --silent
          gh api -X POST "$root/issues/19/labels" -f "labels[]=$label" --silent
          gh api -X DELETE "$root/issues/19/labels/$label" --silent
          comment=$(gh api -X POST "$root/issues/20/comments" -f body="Approval mechanism probe (run $GITHUB_RUN_ID). This comment cannot authorize a merge." --jq .id)
          for attempt in 1 2; do
            found=$(gh api "$root/issues/comments/$comment/reactions?content=%2B1" --jq length)
            printf 'Reaction read %s: %s thumbs-up at %s\n' "$attempt" "$found" "$(date -u +%FT%TZ)" >> "$GITHUB_STEP_SUMMARY"
            if [ "$attempt" = 1 ]; then sleep 15; fi
          done
          gh api --paginate "$root/issues/19/timeline?per_page=100" | jq -r --arg label "$label" '.[] | select(.label.name==$label) | [.event,.label.name,.actor.login,.actor.type,.id,.created_at] | @tsv' >> "$GITHUB_STEP_SUMMARY"
          gh api -X DELETE "$root/labels/$label" --silent
