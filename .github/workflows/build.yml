name: Negative-test unauthorized actor probe
on: workflow_dispatch
permissions:
  contents: read
  issues: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: 2396228c817ac250d3b6e71e5e8b94be089dcbd5
          persist-credentials: false
      - name: Verify production rules reject bot reaction and bot removal on a disposable issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONPATH: tools/telemetry-contract
        run: |
          python3 - <<'PY'
          import os
          from alternative_gate import BOT, label_approval, label_name, reaction_approval
          from gate import GitHub
          api = GitHub(os.environ["GITHUB_TOKEN"])
          prefix = "/repos/" + os.environ["GITHUB_REPOSITORY"]
          origin = int(os.environ["GITHUB_RUN_ID"])
          issue = api.post(f"{prefix}/issues", {"title":"Negative tests · bot authorization probe",
                           "body":"Disposable evidence for the reaction and label decision rules. No merge is associated with this issue."})
          pr = issue["number"]
          name = label_name(pr, origin)
          try:
              comment = api.post(f"{prefix}/issues/{pr}/comments", {"body":"Disposable authorization target for this Actions run."})
              reaction = api.post(f"{prefix}/issues/comments/{comment['id']}/reactions", {"content":"+1"})
              assert reaction["user"]["type"] == "Bot" and reaction["user"]["login"] == BOT
              assert reaction_approval(api, prefix, {"comment_id":comment["id"]}) is None
              label = api.post(f"{prefix}/labels", {"name":name, "color":"b60205"})
              state = {"origin":origin,"pr":pr,"label_id":label["id"]}
              api.post(f"{prefix}/issues/{pr}/labels", {"labels":[name]})
              api.run("api", "-X", "DELETE", f"{prefix}/issues/{pr}/labels/{name}")
              assert label_approval(api, prefix, state) is None
              assert any(item["id"]==label["id"] for item in api.get(f"{prefix}/issues/{pr}/labels"))
              message = f"Bot thumbs-up rejected. Bot label removal rejected and label restored. Evidence: {issue['html_url']}."
              print(message)
              with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as summary:
                  print(message, file=summary)
          finally:
              api.patch(f"{prefix}/issues/{pr}", {"state":"closed"})
          PY
