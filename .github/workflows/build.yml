name: Negative-test stale target probe
on: workflow_dispatch
permissions: read-all
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: 36bdbe965dca4a6c990435cb505356d8b812bd6f
          persist-credentials: false
      - name: Verify older decision target cannot authorize the current report
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONPATH: tools/telemetry-contract
        run: |
          python3 - <<'PY'
          import contextlib, io, json, os, tempfile
          from pathlib import Path
          from alternative_gate import reconcile
          from gate import GitHub, Rejected
          from recheck import check
          from controller import latest_status, source_run, validate_context
          api = GitHub(os.environ["GITHUB_TOKEN"])
          repo = os.environ["GITHUB_REPOSITORY"]
          prefix = "/repos/" + repo
          output = io.StringIO()
          with contextlib.redirect_stdout(output):
              check(api, repo, 19, removed="review-19-45601534905")
          assert "Ignored a label action for an older report." in output.getvalue()
          print(output.getvalue().strip())
          head = api.get(f"{prefix}/pulls/20")["head"]["sha"]
          status = latest_status(api, prefix, {"source_head_sha":head})
          run_id = int(status["target_url"].rsplit("/",1)[1])
          with tempfile.TemporaryDirectory() as tmp:
              d = Path(tmp)
              api.download(repo, run_id, f"telemetry-review-state-{run_id}-1", d)
              state = json.loads((d / "state.json").read_text())
              source = source_run(api, prefix, state["source_run_id"], repo)
              manifest, delta = validate_context(api, prefix, state, d, source)
              state["comment_id"] = 7160635735
              try:
                  reconcile(api, prefix, state, manifest, delta)
              except Rejected as err:
                  assert "original decision comment changed" in str(err), str(err)
                  print("A different real same-PR comment was rejected before decision evaluation.")
              else:
                  raise AssertionError("Expected the original-report identity check to reject")
          PY
